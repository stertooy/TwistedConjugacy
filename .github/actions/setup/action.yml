name: Setup
description: "Setup GAPROOT and dependencies"

runs:
  using: "composite"
  steps:

    - name: "Add custom GAP root"
      shell: bash
      run: ln -f -s $PWD /tmp/gaproot/pkg/

    - name: "Install polycyclic"
      uses: stertooy/install-pkg@endgroup
      with:
        packages: polycyclic@devel
